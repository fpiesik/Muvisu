name: GitHub Pages bereitstellen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statische Website verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
